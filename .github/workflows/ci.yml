name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cinema:ci_password@localhost:5432/dna_cinema?schema=public
      DIRECT_URL: postgresql://cinema:ci_password@localhost:5432/dna_cinema?schema=public
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx prisma validate
      - run: npm run build